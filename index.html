<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poké-Citas | Hyundai Coatza</title>
    <!-- Fuentes y Librerías -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==========================================
         SECCIÓN 1: PANTALLA DE LOGIN (POKÉDEX)
         ========================================== -->
    <div id="login-screen" class="screen active">
        <div class="pokedex-container">
            <!-- 1.1 Luces Superiores -->
            <div class="screen-header">
                <div class="blue-light"></div>
                <div class="small-lights">
                    <div class="red-light"></div>
                    <div class="yellow-light"></div>
                    <div class="green-light"></div>
                </div>
            </div>
            
            <!-- 1.2 Pantalla de Acceso -->
            <div class="pokedex-screen">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Pikachu" class="pokemon-sprite bounce">
                <h2>CENTRO HYUNDAI</h2>
                <p>Ingresa el código secreto...</p>
                
                <div class="input-group">
                    <label>CÓDIGO DE ACCESO:</label>
                    <input type="password" id="password" placeholder="****">
                </div>
                
                <button id="btn-login" class="poke-btn">
                    ENTRAR <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" width="16">
                </button>
            </div>
        </div>
    </div>

    <!-- ==========================================
         SECCIÓN 2: PANTALLA PRINCIPAL (PC DE BILL)
         ========================================== -->
    <div id="main-screen" class="screen hidden pc-background">
        <div class="pc-container">
            
            <!-- 2.1 Encabezado del Sistema -->
            <header class="pc-header">
                <h2>💻 SISTEMA DE ALMACENAMIENTO - HYUNDAI</h2>
                <div class="pc-status">
                    <span class="status-dot"></span> Conectado a la red
                </div>
            </header>

            <!-- ==========================================
                 SECCIÓN 3: PANEL DE ADMINISTRADOR
                 ========================================== -->
            <div id="admin-panel" class="admin-panel">
                <h3>⚙️ Módulo de Carga (Excel)</h3>
                <input type="file" id="excel-upload" accept=".xls,.xlsx">
                <p id="upload-status">Esperando archivo mensual...</p>
            </div>

            <!-- ==========================================
                 SECCIÓN 4: BASE DE DATOS Y TABLA
                 ========================================== -->
            <div class="table-container">
                <h3 style="color: white; margin-bottom: 10px;">► Base de Datos de Clientes (Directorio)</h3>
                <div id="table-wrapper">
                    <p style="color: #6bf;">Iniciando conexión con Firebase para traer a los clientes...</p>
                    <!-- Aquí se inyectará la tabla interactiva más adelante -->
                </div>
            </div>

        </div>
    </div>

    <!-- ==========================================
         SECCIÓN 5: SCRIPTS Y LÓGICA DE PROGRAMACIÓN
         ========================================== -->
    <script type="module" src="app.js"></script>

</body>
</html>
