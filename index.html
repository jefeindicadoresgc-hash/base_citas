<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poké-Citas | Hyundai Coatza</title>
    <!-- Fuentes y Librerías -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ==========================================
         SECCIÓN 0: DECORACIONES POKÉMON (FONDO)
         ========================================== -->
    <div id="decorations">
        <!-- Snorlax Acostado (Tu archivo local) -->
        <div class="snorlax-container">
            <div class="zzz zzz1">Z</div>
            <div class="zzz zzz2">z</div>
            <div class="zzz zzz3">z</div>
            <img src="image_1774f4.png" alt="Snorlax Relajado" class="snorlax-img">
        </div>
        
        <!-- Squirtle Saxofonista (Tu archivo local) -->
        <div class="squirtle-container">
            <img src="image_17749a.png" alt="Squirtle Sax" class="squirtle-img">
        </div>
    </div>

    <!-- ... (El inicio de la Sección 1 se queda igual) ... -->

                <!-- Minijuego CAPTCHA -->
                <div id="captcha-section" class="captcha-box">
                    
                    <!-- NUEVO: Botón para encender y destrabar el audio -->
                    <div id="power-on-screen">
                        <button id="btn-power-on" class="poke-btn" style="background-color: #4CAF50; color: white;">
                            ENCENDER POKÉDEX
                        </button>
                    </div>

                    <!-- El juego (Oculto hasta que encienda) -->
                    <div id="game-screen" class="hidden">
                        <p class="captcha-title">¿QUIÉN ES ESTE POKÉMON?</p>
                        <img id="captcha-img" src="" class="silhouette" alt="Misterio">
                        <p id="captcha-hint" class="hint-text">Cargando pista...</p>
                        <div id="captcha-buttons" class="btn-grid"></div>
                    </div>
                </div>
    <!-- ==========================================
         SECCIÓN 2: PANTALLA PRINCIPAL (PC DE BILL)
         ========================================== -->
    <div id="main-screen" class="screen hidden pc-background">
        <div class="pc-container">
            <header class="pc-header">
                <h2>💻 SISTEMA DE ALMACENAMIENTO - HYUNDAI</h2>
                <div class="pc-status">
                    <span class="status-dot"></span> Conectado a la red
                </div>
                <button id="btn-logout" style="background: red; color: white; padding: 5px; cursor: pointer; border: none; border-radius: 4px;">Cerrar Sesión</button>
            </header>

            <div id="admin-panel" class="admin-panel">
                <h3>⚙️ Módulo de Carga (Excel)</h3>
                <input type="file" id="excel-upload" accept=".xls,.xlsx">
                <p id="upload-status">Esperando archivo mensual...</p>
            </div>

            <div class="table-container">
                <h3 style="color: white; margin-bottom: 10px;">► Base de Datos de Clientes (Directorio)</h3>
                <div id="table-wrapper">
                    <p style="color: #6bf;">Iniciando conexión con Firebase para traer a los clientes...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
